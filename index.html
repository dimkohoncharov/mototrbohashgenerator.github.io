<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotoTRBO Hash generator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-startup-image" href="splash/splash-640x1136.png"
    media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-750x1334.png"
    media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-828x1792.png"
    media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1125x2436.png"
    media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1170x2532.png"
    media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1242x2688.png"
    media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1284x2778.png"
    media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1290x2796.png"
    media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1536x2048.png"
    media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1668x2224.png"
    media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1668x2388.png"
    media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-2048x2732.png"
    media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script defer src="app.js"></script>
  <meta name="theme-color" content="#00529B">
  <style>
    #splash {
      position: fixed;
      inset: 0;
      background: #00529B;
      display: grid;
      place-items: center;
      z-index: 9999;
      transition: opacity .25s ease
    }

    #splash img {
      width: 160px;
      height: 160px;
      border-radius: 24px
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none
    }

    @media (display-mode: standalone) {
      @supports (-webkit-touch-callout: none) {

        /* iOS Safari PWA */
        #splash {
          display: none !important;
        }
      }
    }

    body {
      padding: 20px;
    }

    .tab-content {
      margin-top: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div id="splash">
    <img src="icons/icon-192x192.png" alt="logo">
  </div>
  <nav class="nav-extended blue darken-3">
    <div class="nav-wrapper">
      <a href="#" class="brand-logo left">MotoTRBO Hash generator</a>
    </div>
    <div class="nav-content">
      <ul class="tabs tabs-transparent tabs-fixed-width">
        <li class="tab"><a href="#tab1" class="active">Symmetric</a></li>
        <li class="tab"><a href="#tab2">RAS</a></li>
        <li class="tab"><a href="#tab3">OTAP</a></li>
        <li class="tab"><a href="#tab4">PSK</a></li>
      </ul>
    </div>
  </nav>

  <div id="tab1" class="col s12 tab-content">
    <div class="row">
      <div class="input-field col s6">
        <input id="symmetric_keys_count" type="number" class="validate" min="1" max="64" value="32">
        <label for="symmetric_keys_count">Number of hashes</label>
      </div>
      <div class="input-field col s6">
        <input id="symmetric_keys_start_id" type="number" class="validate" min="1" max="999" value="100">
        <label for="symmetric_keys_start_id">Start ID</label>
      </div>
      <div class="col s12">
        <button class="btn waves-effect waves-light" type="submit"
          onclick="javascript:generateSymmetricKeys()">Generate</button>
        <button class="btn waves-effect waves-light export" type="submit"
          onclick="javascript:exportTableToCSV('#keys_output')">Export</button>
      </div>
    </div>
  </div>

  <div id="tab2" class="col s12 tab-content">
    <div class="row">
      <div class="input-field col s6">
        <input id="ras_keys_count" type="number" class="validate" min="1" max="999" value="1">
        <label for="ras_keys_count">Number of hashes</label>

      </div>
      <div class="input-field col s6">
        <input id="ras_keys_length" type="number" class="validate" min="6" max="24" value="24">
        <label for="ras_keys_length">Hash length</label>
      </div>
      <div class="col s12">
        <button class="btn waves-effect waves-light" type="submit"
          onclick="javascript:generateRASKeys()">Generate</button>
        <button class="btn waves-effect waves-light export" type="submit"
          onclick="javascript:exportTableToCSV('#keys_output')">Export</button>
      </div>
    </div>
  </div>

  <div id="tab3" class="col s12 tab-content">
    <div class="row">
      <div class="input-field col s6">
        <input id="otap_keys_count" type="number" class="validate" min="1" max="999" value="1">
        <label for="otap_keys_count">Number of hashes</label>

      </div>
      <div class="input-field col s6">
        <input id="otap_keys_length" type="number" class="validate" min="1" max="10" value="10">
        <label for="otap_keys_length">Hash length</label>
      </div>
      <div class="col s12">
        <button class="btn waves-effect waves-light" type="submit"
          onclick="javascript:generateOTAPKeys()">Generate</button>
        <button class="btn waves-effect waves-light export" type="submit"
          onclick="javascript:exportTableToCSV('#keys_output')">Export</button>
      </div>
    </div>
  </div>
  <div id="tab4" class="col s12 tab-content">
    <div class="row">
      <div class="input-field col s6">
        <input id="psk_keys_count" type="number" class="validate" min="1" max="999" value="1">
        <label for="psk_keys_count">Number of hashes</label>

      </div>
      <div class="input-field col s6">
        <input id="psk_keys_length" type="number" class="validate" min="1" max="32" value="32">
        <label for="psk_keys_length">Hash length</label>
      </div>
      <div class="col s12">
        <button class="btn waves-effect waves-light" type="submit"
          onclick="javascript:generatePSKKeys()">Generate</button>
        <button class="btn waves-effect waves-light export" type="submit"
          onclick="javascript:exportTableToCSV('#keys_output')">Export</button>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col s12">
      <table class="output hidden" id="keys_output">
        <thead>
          <tr>
            <th>ID</th>
            <th>Hash</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td><i class="material-icons copy">content_copy</i><span>adsfdsfkjl2314dasfdsf</span></td>
          </tr>
        </tbody>
      </table>
      <button class="btn waves-effect waves-light red clear output hidden" style="margin-top: 24px"
        onclick="javascript:clearContent()">Clear</button>
    </div>
  </div>
  <script>
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const splashEl = document.getElementById('splash');
    if (splashEl) {
      if (isMobile) {
        splashEl.classList.add('hide');
      } else {
        window.addEventListener('load', () => {
          //setTimeout(() => splashEl.classList.add('hide'), 300);
          requestAnimationFrame(() => document.getElementById('splash')?.classList.add('hide'));
        });
      }
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    document.addEventListener('DOMContentLoaded', function () {
      const tabs = document.querySelectorAll('.tabs');
      M.Tabs.init(tabs);
    });
  </script>
</body>

</html>
